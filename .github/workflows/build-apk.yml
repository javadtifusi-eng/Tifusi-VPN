name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to create the release and upload the APK to it.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug

      # The asset name has to stay constant, otherwise the
      # releases/latest/download/tifusi-vpn.apk link breaks on every build.
      - name: Name the APK
        run: mv app/build/outputs/apk/debug/*.apk tifusi-vpn.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tifusi VPN v${{ github.run_number }}
          files: tifusi-vpn.apk
