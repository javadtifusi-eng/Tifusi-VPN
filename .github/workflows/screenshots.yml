name: Screenshots

# Renders the main screens on several phone sizes, font scales and both languages
# (app/src/test/.../ui/ScreenshotTest.kt) and uploads the images, to review layouts on phones
# nobody here has. Manual, or on test branches.
on:
  push:
    branches: ["test/**"]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Render screens
        run: gradle testDebugUnitTest --tests 'com.tifusi.vpn.ui.ScreenshotTest'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots
