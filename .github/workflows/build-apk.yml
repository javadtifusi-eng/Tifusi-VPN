name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to create the release and upload the APK to it.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The default package list includes the legacy `tools` package, which Google stopped serving
      # on 2026-09-15 (android-actions/setup-android#537); the build only needs platform-tools.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # The Xray core behind VLESS (github.com/2dust/AndroidLibXrayLite). At ~62 MB it is fetched
      # per build instead of committed; the version and checksum are pinned so an upstream re-upload
      # can never change what ships unnoticed. Any failure here stops the build.
      - name: Download Xray core (libv2ray.aar)
        env:
          LIBXRAY_VERSION: v26.9.9
          LIBXRAY_SHA256: 9ecf4c921568d8f4cb8550d3bafe08ff6f1d1984f45a6ad183dcdf52ee9302de
        run: |
          mkdir -p app/libs
          curl -fsSL --retry 3 -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${LIBXRAY_VERSION}/libv2ray.aar"
          echo "${LIBXRAY_SHA256}  app/libs/libv2ray.aar" | sha256sum -c -

      # The official Hysteria2 client, run by HysteriaClient as a local SOCKS5 proxy for the Xray
      # core. Shipped as libhysteria.so because Android only executes files from the native library
      # directory. Pinned by version and checksum, like the Xray core above.
      - name: Download Hysteria2 client
        env:
          HYSTERIA_VERSION: v2.12.3
        run: |
          fetch() {
            mkdir -p "app/src/main/jniLibs/$1"
            curl -fsSL --retry 3 -o "app/src/main/jniLibs/$1/libhysteria.so" \
              "https://github.com/apernet/hysteria/releases/download/app%2F${HYSTERIA_VERSION}/$2"
            echo "$3  app/src/main/jniLibs/$1/libhysteria.so" | sha256sum -c -
          }
          fetch arm64-v8a   hysteria-android-arm64 8a946481d20eb5cd94be79dce0464d538098dfea3a721d7f41afb0a0564ef18d
          fetch armeabi-v7a hysteria-android-armv7 42354a3ac4f0b8ba33ee3d790180c627384c718e6236ce63519460427459af36

      # The tag stays v<run number>: installed apps parse it as a number to detect updates. Only
      # the release title shows the user-facing 1.N version.
      - name: Version name
        run: |
          base=$(grep '^tifusi.versionBase=' gradle.properties | cut -d= -f2)
          echo "VERSION_NAME=1.$(( ${{ github.run_number }} - base ))" >> "$GITHUB_ENV"

      # The run number becomes versionCode/versionName and the release tag below, so the
      # About tab can tell whether a newer build exists.
      - name: Build release APK
        run: gradle assembleRelease -Ptifusi.buildNumber=${{ github.run_number }}

      # Signing with key rotation. The v2 block is signed with the old public key, so Android 8
      # keeps accepting updates; the v3 block is signed with the private release key plus the
      # lineage proving the old key handed over to it, so Android 9+ installs the update in place
      # and from then on refuses any APK signed with the old key alone (rollback is not granted).
      # The asset names have to stay constant, otherwise the releases/latest/download links break
      # on every build. tifusi-vpn.apk stays the universal APK: the in-app updater downloads it.
      - name: Sign the APKs
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.TIFUSI_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TIFUSI_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::The release signing secrets are not set"
            exit 1
          fi
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ks="$RUNNER_TEMP/release.p12"
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$ks"
          out=app/build/outputs/apk/release
          sign() {
            "$bt/zipalign" -f -p 4 "$out/app-$1-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
            "$bt/apksigner" sign \
              --ks app/tifusi-debug.p12 --ks-pass pass:tifusi-debug --ks-key-alias tifusi \
              --next-signer --ks "$ks" --ks-pass env:RELEASE_KEYSTORE_PASSWORD --ks-key-alias tifusi-release \
              --lineage app/signing/lineage.bin --rotation-min-sdk-version 28 \
              --out "$2" "$RUNNER_TEMP/aligned.apk"
            "$bt/apksigner" verify --min-sdk-version 26 "$2"
          }
          sign universal tifusi-vpn.apk
          sign arm64-v8a tifusi-vpn-arm64.apk
          sign armeabi-v7a tifusi-vpn-armv7.apk
          rm -f "$ks"
          ls -la tifusi-vpn*.apk

      # The build every customer has installed right now, so the emulator can install this one over
      # it exactly as the in-app updater does. A signing mistake shows up here as a refused update
      # instead of on customers' phones.
      - name: Download the currently published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern tifusi-vpn.apk --output previous.apk \
            || { echo "No published release yet; the upgrade check is skipped."; exit 0; }
          # SHA-256 of the old public key's certificate (app/tifusi-debug.p12).
          old=26137e0f91870feb5e812de522cfc664e0e05a9c300946c708b43eb3fa2f615e
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          if "$bt/apksigner" verify --print-certs --min-sdk-version 28 previous.apk | grep -q "SHA-256 digest: $old"; then
            echo "PREVIOUS_OLD_KEY=1" >> "$GITHUB_ENV"
          fi

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Nothing is published unless the app survives being opened. The x86_64 image runs the ARM
      # libraries through the emulator's ARM translation.
      - name: Smoke test on emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/smoke-test.sh tifusi-vpn.apk previous.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tifusi VPN ${{ env.VERSION_NAME }}
          files: |
            tifusi-vpn.apk
            tifusi-vpn-arm64.apk
            tifusi-vpn-armv7.apk

      # Only the newest build stays on the Releases page. The updater and the download links only use
      # releases/latest, and a build that fails the smoke test never reaches this step.
      - name: Delete older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' \
            | grep -vx "v${{ github.run_number }}" \
            | xargs -r -n1 gh release delete --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
