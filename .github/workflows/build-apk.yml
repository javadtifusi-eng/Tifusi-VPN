name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to create the release and upload the APK to it.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The default package list includes the legacy `tools` package, which Google stopped serving
      # on 2026-09-15 (android-actions/setup-android#537); the build only needs platform-tools.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # The Xray core behind VLESS (github.com/2dust/AndroidLibXrayLite). At ~62 MB it is fetched
      # per build instead of committed; the version and checksum are pinned so an upstream re-upload
      # can never change what ships unnoticed. Any failure here stops the build.
      - name: Download Xray core (libv2ray.aar)
        env:
          LIBXRAY_VERSION: v26.9.9
          LIBXRAY_SHA256: 9ecf4c921568d8f4cb8550d3bafe08ff6f1d1984f45a6ad183dcdf52ee9302de
        run: |
          mkdir -p app/libs
          curl -fsSL --retry 3 -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${LIBXRAY_VERSION}/libv2ray.aar"
          echo "${LIBXRAY_SHA256}  app/libs/libv2ray.aar" | sha256sum -c -

      # The official Hysteria2 client, run by HysteriaClient as a local SOCKS5 proxy for the Xray
      # core. Shipped as libhysteria.so because Android only executes files from the native library
      # directory. Pinned by version and checksum, like the Xray core above.
      - name: Download Hysteria2 client
        env:
          HYSTERIA_VERSION: v2.12.3
        run: |
          fetch() {
            mkdir -p "app/src/main/jniLibs/$1"
            curl -fsSL --retry 3 -o "app/src/main/jniLibs/$1/libhysteria.so" \
              "https://github.com/apernet/hysteria/releases/download/app%2F${HYSTERIA_VERSION}/$2"
            echo "$3  app/src/main/jniLibs/$1/libhysteria.so" | sha256sum -c -
          }
          fetch arm64-v8a   hysteria-android-arm64 8a946481d20eb5cd94be79dce0464d538098dfea3a721d7f41afb0a0564ef18d
          fetch armeabi-v7a hysteria-android-armv7 42354a3ac4f0b8ba33ee3d790180c627384c718e6236ce63519460427459af36

      # The tag stays v<run number>: installed apps parse it as a number to detect updates. Only
      # the release title shows the user-facing 1.N version.
      - name: Version name
        run: |
          base=$(grep '^tifusi.versionBase=' gradle.properties | cut -d= -f2)
          echo "VERSION_NAME=1.$(( ${{ github.run_number }} - base ))" >> "$GITHUB_ENV"

      # The run number becomes versionCode/versionName and the release tag below, so the
      # About tab can tell whether a newer build exists.
      - name: Build release APK
        run: gradle assembleRelease -Ptifusi.buildNumber=${{ github.run_number }}

      # The asset names have to stay constant, otherwise the releases/latest/download links break
      # on every build. tifusi-vpn.apk stays the universal APK: the in-app updater downloads it.
      - name: Name the APKs
        run: |
          out=app/build/outputs/apk/release
          mv "$out/app-universal-release.apk" tifusi-vpn.apk
          mv "$out/app-arm64-v8a-release.apk" tifusi-vpn-arm64.apk
          mv "$out/app-armeabi-v7a-release.apk" tifusi-vpn-armv7.apk
          ls -la tifusi-vpn*.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Nothing is published unless the app survives being opened. The x86_64 image runs the ARM
      # libraries through the emulator's ARM translation.
      - name: Smoke test on emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/smoke-test.sh tifusi-vpn.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tifusi VPN ${{ env.VERSION_NAME }}
          files: |
            tifusi-vpn.apk
            tifusi-vpn-arm64.apk
            tifusi-vpn-armv7.apk

      # Only the newest build stays on the Releases page. The updater and the download links only use
      # releases/latest, and a build that fails the smoke test never reaches this step.
      - name: Delete older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' \
            | grep -vx "v${{ github.run_number }}" \
            | xargs -r -n1 gh release delete --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag

  # The Windows app ships in the same release as the APK (same v<run number> tag and version
  # number), after the Android job has created that release.
  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Windows app
        run: dotnet publish windows/TifusiVPN/TifusiVPN.csproj -c Release -p:TifusiBuildNumber=${{ github.run_number }} -o publish

      # Constant name, so releases/latest/download/TifusiVPN.exe always points at the newest build.
      - name: Name the exe
        shell: pwsh
        run: Move-Item publish/TifusiVPN.exe TifusiVPN.exe

      - name: Version name
        shell: bash
        run: |
          base=$(grep '^tifusi.versionBase=' gradle.properties | cut -d= -f2 | tr -d '\r')
          echo "VERSION_NAME=1.$(( ${{ github.run_number }} - base ))" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tifusi VPN ${{ env.VERSION_NAME }}
          files: TifusiVPN.exe
