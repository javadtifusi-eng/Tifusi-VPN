org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Branding for this build of Tifusi VPN. A bare app code resolves against tifusi.panelUrl
# (CODE@panel.example.com reaches any other panel), and tifusi.supportTelegram is the Telegram
# username shown under "Contact us" on the Profile tab. Either may be empty.
tifusi.panelUrl=
tifusi.supportTelegram=javadheydeari
# Support e-mail behind the About screen's e-mail button; the address itself is never shown.
tifusi.supportEmail=javadtifusi@gmail.com
# GitHub owner/repo whose latest release the About tab checks for updates; empty hides the check.
tifusi.updateRepo=javadtifusi-eng/Tifusi-VPN
# Last CI run number before the current version series; run number versionBase + N is shown as 1.N.
# Restarted at 1.1 with run 27. CI names each release from this too.
tifusi.versionBase=26
