name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to create the release and upload the APK to it.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tifusi-release.p12"

      - name: Build release APK
        env:
          TIFUSI_KEYSTORE: ${{ runner.temp }}/tifusi-release.p12
          TIFUSI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease

      # The asset name has to stay constant, otherwise the
      # releases/latest/download/tifusi-vpn.apk link breaks on every build.
      - name: Name the APK
        run: mv app/build/outputs/apk/release/*.apk tifusi-vpn.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tifusi VPN v${{ github.run_number }}
          files: tifusi-vpn.apk
